[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parto"
version = "0.3.1"
description = "A fast, modern, and lightweight desktop image editor built with Python and PySide6."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ali Kamrani (MRThugh)", email = "kamrani.exe@gmail.com"}
]
maintainers = [
    {name = "Ali Kamrani (علی کامرانی)", email = "kamrani.exe@gmail.com"}
]
keywords = ["image-editor", "pyside6", "qt", "pillow", "graphics", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
]
dependencies = [
    "PySide6>=6.4.0",
    "Pillow>=9.5.0",
    "numpy>=1.24.0",
    "pillow-heif>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
test = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/MRThugh/Parto"
Repository = "https://github.com/MRThugh/Parto"
Issues = "https://github.com/MRThugh/Parto/issues"
Changelog = "https://github.com/MRThugh/Parto/blob/main/CHANGELOG.md"

[project.scripts]
parto = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
